<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1e1e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;user-select:none;padding:8px 16px}
.wrap{width:100%;max-width:700px;display:flex;align-items:center;gap:20px}
.now{display:flex;align-items:center;gap:10px;flex-shrink:0}
.icon{font-size:28px;line-height:1}
.temp{font-size:24px;font-weight:700;color:#e8e8e8;line-height:1}
.meta{display:flex;flex-direction:column;gap:1px}
.desc{font-size:11px;color:#9b9b9b;text-transform:capitalize}
.details{font-size:10px;color:#666}
.sep{width:1px;height:32px;background:#333;flex-shrink:0}
.forecast{display:flex;gap:14px;flex:1;justify-content:space-around}
.fday{display:flex;align-items:center;gap:6px}
.fday .day{font-size:10px;color:#666;text-transform:uppercase;width:24px}
.fday .ficon{font-size:16px}
.fday .ftemp{font-size:11px;color:#999;white-space:nowrap}
.fday .fhi{color:#bbb}
.err{color:#666;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="w">
  <div class="err" id="loading">Loading…</div>
</div>
<script>
const LAT=40.7128,LON=-74.0060,CITY='NYC';
const WMO={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌧',55:'🌧',56:'🌨',57:'🌨',61:'🌧',63:'🌧',65:'🌧️',66:'🌨',67:'🌨',71:'🌨',73:'❄️',75:'❄️',77:'❄️',80:'🌦',81:'🌧',82:'⛈',85:'❄️',86:'❄️',95:'⛈',96:'⛈',99:'⛈'};
const WMO_DESC={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'T-storm + hail',99:'Severe storm'};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

async function load(){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=5`);
    const d=await r.json();
    const c=d.current;
    const daily=d.daily;
    const icon=WMO[c.weather_code]||'🌡';
    const desc=WMO_DESC[c.weather_code]||'';

    let html=`
      <div class="now">
        <div class="icon">${icon}</div>
        <div class="meta">
          <div class="temp">${Math.round(c.temperature_2m)}°F</div>
          <div class="desc">${desc} · ${CITY}</div>
          <div class="details">Feels ${Math.round(c.apparent_temperature)}° · ${c.relative_humidity_2m}% · ${Math.round(c.wind_speed_10m)} mph</div>
        </div>
      </div>
      <div class="sep"></div>
      <div class="forecast">`;

    for(let i=1;i<5;i++){
      const dt=new Date(daily.time[i]+'T12:00:00');
      const dayName=DAYS[dt.getDay()];
      const ficon=WMO[daily.weather_code[i]]||'🌡';
      html+=`<div class="fday">
        <div class="day">${dayName}</div>
        <div class="ficon">${ficon}</div>
        <div class="ftemp"><span class="fhi">${Math.round(daily.temperature_2m_max[i])}°</span>/${Math.round(daily.temperature_2m_min[i])}°</div>
      </div>`;
    }
    html+='</div>';
    document.getElementById('w').innerHTML=html;
  }catch(e){
    document.getElementById('loading').textContent='Weather unavailable';
  }
}
load();
setInterval(load,1800000);
</script>
</body>
</html>
