<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1e1e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;user-select:none;padding:12px}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:14px}
.icon{font-size:clamp(36px,8vw,48px);line-height:1}
.main{display:flex;flex-direction:column;gap:2px}
.temp{font-size:clamp(28px,6vw,36px);font-weight:700;color:#e8e8e8;line-height:1}
.desc{font-size:clamp(12px,2.5vw,14px);color:#9b9b9b;text-transform:capitalize}
.loc{font-size:clamp(10px,2vw,11px);color:#666;letter-spacing:0.5px}
.details{display:flex;gap:16px;flex-wrap:wrap}
.detail{font-size:clamp(11px,2.2vw,13px);color:#777}
.detail span{color:#aaa}
.forecast{display:flex;justify-content:space-between;margin-top:4px}
.fday{display:flex;flex-direction:column;align-items:center;gap:2px}
.fday .day{font-size:clamp(9px,1.8vw,11px);color:#666;text-transform:uppercase}
.fday .ficon{font-size:clamp(16px,3.5vw,20px)}
.fday .ftemp{font-size:clamp(10px,2vw,12px);color:#999}
.fday .fhi{color:#bbb}
.err{color:#666;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="w">
  <div class="err" id="loading">Loading weather…</div>
</div>
<script>
// NYC coordinates
const LAT=40.7128,LON=-74.0060,CITY='New York';

const WMO={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌧',55:'🌧',56:'🌨',57:'🌨',61:'🌧',63:'🌧',65:'🌧️',66:'🌨',67:'🌨',71:'🌨',73:'❄️',75:'❄️',77:'❄️',80:'🌦',81:'🌧',82:'⛈',85:'❄️',86:'❄️',95:'⛈',96:'⛈',99:'⛈'};
const WMO_DESC={0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm w/ hail',99:'Severe thunderstorm'};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

async function load(){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=5`);
    const d=await r.json();
    const c=d.current;
    const daily=d.daily;
    
    const icon=WMO[c.weather_code]||'🌡';
    const desc=WMO_DESC[c.weather_code]||'';
    
    let html=`
      <div class="top">
        <div class="icon">${icon}</div>
        <div class="main">
          <div class="temp">${Math.round(c.temperature_2m)}°F</div>
          <div class="desc">${desc}</div>
          <div class="loc">${CITY}</div>
        </div>
      </div>
      <div class="details">
        <div class="detail">Feels <span>${Math.round(c.apparent_temperature)}°</span></div>
        <div class="detail">Humidity <span>${c.relative_humidity_2m}%</span></div>
        <div class="detail">Wind <span>${Math.round(c.wind_speed_10m)} mph</span></div>
      </div>
      <div class="forecast">`;
    
    for(let i=1;i<5;i++){
      const dt=new Date(daily.time[i]+'T12:00:00');
      const dayName=DAYS[dt.getDay()];
      const ficon=WMO[daily.weather_code[i]]||'🌡';
      html+=`<div class="fday">
        <div class="day">${dayName}</div>
        <div class="ficon">${ficon}</div>
        <div class="ftemp"><span class="fhi">${Math.round(daily.temperature_2m_max[i])}°</span> ${Math.round(daily.temperature_2m_min[i])}°</div>
      </div>`;
    }
    html+='</div>';
    document.getElementById('w').innerHTML=html;
  }catch(e){
    document.getElementById('loading').textContent='Weather unavailable';
  }
}
load();
setInterval(load,1800000); // refresh every 30 min
</script>
</body>
</html>
