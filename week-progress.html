<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week Progress</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1e1e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;user-select:none}
.wrap{width:90%;max-width:400px;display:flex;flex-direction:column;gap:10px}
.header{display:flex;justify-content:space-between;align-items:baseline}
.week-num{font-size:clamp(14px,3vw,18px);font-weight:600;color:#9b9b9b;letter-spacing:1px}
.day-label{font-size:clamp(12px,2.5vw,15px);color:#6b6b6b}
.bar-bg{width:100%;height:10px;background:rgba(155,155,155,.2);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#5b8fb9,#7ec8e3);transition:width .5s ease}
.days{display:flex;justify-content:space-between;margin-top:2px}
.day{font-size:clamp(10px,2vw,12px);color:#555;font-weight:500;width:14.28%;text-align:center}
.day.done{color:#7ec8e3}
.day.today{color:#fff;font-weight:700}
.pct{font-size:clamp(12px,2.5vw,15px);color:#6b6b6b}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <span class="week-num" id="weekNum"></span>
    <span class="pct" id="pct"></span>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="fill"></div></div>
  <div class="days" id="days"></div>
</div>
<script>
const now=new Date();
const dayOfWeek=now.getDay();
const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// ISO week number
function getWeek(d){const t=new Date(d.valueOf());t.setDate(t.getDate()+3-(t.getDay()+6)%7);const y=t.getFullYear();const w=Math.ceil((((t-new Date(y,0,4))/864e5)+1)/7);return w;}

const wk=getWeek(now);
document.getElementById('weekNum').textContent='WEEK '+wk;

// Progress: Mon=0% → Fri EOD=100%, weekend=100%
const hour=now.getHours()+now.getMinutes()/60;
let pct=0;
if(dayOfWeek===0){pct=100;}
else if(dayOfWeek===6){pct=100;}
else{
  // Mon=1..Fri=5. Each day = 20%. Within the day, interpolate by hour (8am-6pm work hours)
  const workDays=dayOfWeek-1; // completed full days (Mon=0, Tue=1, etc)
  const dayProgress=Math.min(1,Math.max(0,(hour-8)/10)); // 8am=0, 6pm=1
  pct=Math.min(100,Math.round((workDays+dayProgress)*20));
}
document.getElementById('pct').textContent=pct+'%';
document.getElementById('fill').style.width=pct+'%';

// Day labels
const daysEl=document.getElementById('days');
['Mon','Tue','Wed','Thu','Fri'].forEach((d,i)=>{
  const span=document.createElement('span');
  span.textContent=d;
  span.className='day';
  const wd=i+1;
  if(wd<dayOfWeek||(dayOfWeek===0||dayOfWeek===6))span.classList.add('done');
  if(wd===dayOfWeek)span.classList.add('today');
  daysEl.appendChild(span);
});
</script>
</body>
</html>
